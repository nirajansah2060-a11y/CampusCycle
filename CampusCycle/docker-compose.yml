services:
  app:
    build: .
    container_name: campuscycle_app
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: campus_user
      DB_PASSWORD: campus_password
      DB_NAME: campuscycle
      DB_PORT: 3306
      SESSION_SECRET: campuscycle-sprint4-demo-secret
    command: npm start

  db:
    image: mysql:8.0
    container_name: campuscycle_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: campuscycle
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: campus_password
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucampus_user", "-pcampus_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  db_data:

